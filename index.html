<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAOSLIVE!</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="topo">
    <div class="logo">CAOS<span>LIVE!</span></div>

    <nav>
      <button onclick="window.scrollTo({top:0,behavior:'smooth'})">
        Início
      </button>

      <button onclick="mostrarMemorias()">
        Recordações
      </button>

      <button id="createPostBtn" class="btn-postar">
        + Criar postagem
      </button>
    </nav>
  </header>

  <main>

    <section class="hero">
      <h1>CAOSLIVE!</h1>
      <p>Compartilhe seus momentos, histórias e recordações.</p>

      <button id="createPostBtn2" class="btn-principal">
        Criar postagem
      </button>
    </section>

    <section class="conteudo">
      <h2>Postagens</h2>

      <div id="feed" class="feed"></div>

      <div id="sem-postagens" class="sem-postagens">
        <h3>Nenhuma postagem ainda</h3>
        <p>Seja o primeiro a publicar alguma coisa!</p>
      </div>
    </section>

  </main>

  <!-- MODAL DE POSTAGEM -->
  <div id="postModal" class="modal">
    <div class="modal-caixa">

      <button id="closeModal" class="fechar">×</button>

      <h2>Criar postagem</h2>

      <form id="postForm">

        <label>Seu nome</label>
        <input
          type="text"
          id="author"
          placeholder="Digite seu nome"
          required
        >

        <label>Mensagem</label>
        <textarea
          id="postText"
          placeholder="O que você quer compartilhar?"
          required
        ></
